kind = "web"
previewPath = "/"
title = "Freight Operations Platform"
description = "A logistics operations platform for shipment tracking, customer quote requests, customer accounts, and secure shipment administration."
version = "1.0.0"
id = "artifacts/freight-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20465

[services.development]
run = "pnpm --filter @workspace/freight-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/freight-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/freight-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20465"
BASE_PATH = "/"
